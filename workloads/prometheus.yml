# Prometheus scrape jobs injected by kube-prometheus-stack.
# Terraform renders ${namespace} from workloads/variables.tf.
scrape_configs:
  - job_name: triton-vllm
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["${namespace}"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: triton-vllm
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: triton
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "8002"
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: component
        replacement: inference
      - target_label: backend
        replacement: vllm

  - job_name: dcgm-exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: .*dcgm-exporter.*
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9400"
