# Prometheus scrape jobs injected by kube-prometheus-stack.
# Terraform renders ${namespace} from workloads/variables.tf.
scrape_configs:
  - job_name: triton-vllm
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - triton-vllm.${namespace}.svc.cluster.local:8002
        labels:
          component: inference
          backend: vllm

  - job_name: dcgm-exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - observability
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        action: keep
        regex: .*dcgm-exporter.*
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        action: keep
        regex: "9400"
